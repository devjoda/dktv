{% extends "base.html" %}
{% block head %}
<title>Kategorier - {{ SERVICE_NAME }}</title>
{% endblock %}
{% block content %}
<div class="page-head wrap">
    <h1>Kategorier</h1>
</div>
<ul class="category-grid wrap">
    {% for c in categories %}
    <li>
        <a class="category" href="{{ c.url }}">
            {% if c.image %}<img src="{{ c.image|thumbnail }}" alt="" loading="lazy">{% endif %}
            <span class="category-title">{{ c.title }}</span>
        </a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
