<div class="col">
    <div class="card shadow-sm">
        <a href="{{ show.url }}">
            <img src="{{ show.wallpaper|thumbnail }}" width="100%" height="225" loading="lazy">
        </a>

        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
                <h2><a href="{{ show.url }}">{{ show.title }}</a>
                </h2>
                {% if show.geo_restricted %}
                <p title="Kun tilgængelig i Danmark">🇩🇰</p>
                {% endif %}
            </div>

            <p class="card-text">{{ show.description }}</p>
        </div>
    </div>
</div>
