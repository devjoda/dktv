{% extends "base.html" %}
{% block head %}
<title>{{ channel.title }}</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js" integrity="sha384-cciJ0zi8d1uMKC2zJd7jvPY4HQt7W4ByUI/FlMkltvBi31aW61rcpVBhpmW8/NwX" crossorigin="anonymous"></script>
<script src="/static/player.js"></script>
{% endblock %}
{% block content %}
<div class="container-fluid pt-2">
    <h1 class="mx-auto" style="width: 100%;">{{ channel.title }}</h1>
    <video id="video" class="mx-auto" controls></video>
</div>
<style>
video {
    width: 100%;
    max-height: 80vh;
    object-fit: contain;
    display: block;
    background-color: black;
}
</style>
<script>
    attachStream(document.getElementById('video'), {{ channel.stream_url|tojson }});
</script>
{% endblock %}
