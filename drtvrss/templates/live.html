{% extends "base.html" %}
{% from "_ui.html" import icon %}
{% block head %}
<title>{{ channel.title }} - {{ SERVICE_NAME }}</title>
{% endblock %}
{% block scripts %}
<link href="/static/vendor/plyr-3.8.4.css" rel="stylesheet" integrity="sha384-VqqE0KSv00qfHvKpRa8aov+g3xtUu2Rw0NsEmtjTOPGn/JDKVghgd56iw/VObHa7">
<script src="/static/vendor/plyr-3.8.4.min.js" integrity="sha384-I+WOYmeHMpGhifL4sNlgOjvE/aIyNeReJ8GmAHzi4hy38rtVS/eav1hVJKvMvHrY"></script>
<script src="/static/vendor/hls-1.7.3.min.js" integrity="sha384-cciJ0zi8d1uMKC2zJd7jvPY4HQt7W4ByUI/FlMkltvBi31aW61rcpVBhpmW8/NwX"></script>
<script src="/static/player.js"></script>
{% endblock %}
{% block content %}
<div class="stage">
    <video id="video" controls></video>
</div>
<div class="watch">
    <div>
        <div class="badges"><span class="tag tag-live">Direkte</span></div>
        <h1 class="watch-title">{{ channel.title }}</h1>
        <p class="meta">Direkte fra DR</p>
    </div>
</div>
<script>
    setupControls(document.getElementById('video'), true);
    attachStream(document.getElementById('video'), {{ channel.stream_url|tojson }});
</script>
{% endblock %}
