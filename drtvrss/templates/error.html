{% extends "base.html" %}
{% from "_ui.html" import icon, search_field %}
{% block head %}
<title>{{ title }} - {{ SERVICE_NAME }}</title>
{% endblock %}
{% block content %}
<div class="empty">
    {{ icon("alert") }}
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    {{ search_field() }}
    <a class="button button-secondary" href="/">Gå til forsiden</a>
</div>
{% endblock %}
